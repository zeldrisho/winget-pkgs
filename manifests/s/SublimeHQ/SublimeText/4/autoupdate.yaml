checkUrl: https://www.sublimetext.com/download
versionRegex: 'Build \K\d+'
versionTemplate: '{MAJOR}.0.0.{MATCH}00'
versionTemplateValues:
  MAJOR: '^\K\d+(?=\d{3}$)'
urlTemplates:
  - https://download.sublimetext.com/sublime_text_build_{MATCH}_x64_setup.exe
  - https://download.sublimetext.com/sublime_text_build_{MATCH}_x64.zip
