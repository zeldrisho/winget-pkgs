checkUrl: https://clientsettingscdn.roblox.com/v1/client-version/WindowsPlayer
# Komac cannot detect this bootstrapper exe and falls back to portable.
installerType: exe
# WinGet uses the release train (for example 0.726), not the API's full build version.
versionRegex: '"version":"\K\d+\.\d+'
urlTemplateValues:
  UPLOAD: '"clientVersionUpload":"\K[^"]+'
urlTemplates: https://setup.rbxcdn.com/{UPLOAD}-RobloxPlayerInstaller.exe
