checkUrl: https://clientsettingscdn.roblox.com/v1/client-version/WindowsStudio64
# WinGet uses the release train (for example 0.747), not the API's full build version.
versionRegex: '"version":"\K\d+\.\d+'
urlTemplateValues:
  UPLOAD: '"clientVersionUpload":"\K[^"]+'
urlTemplates: https://setup.rbxcdn.com/{UPLOAD}-RobloxStudioInstaller.exe
