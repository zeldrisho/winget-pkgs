name: Update WinGet Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC, after the manifests sync

permissions:
  contents: read

concurrency:
  group: update-winget-packages
  cancel-in-progress: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/
            manifests/**/autoupdate.yaml

      - name: Read autoupdate configs
        id: configs
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        with:
          cmd: yq -o=json -I=0 --from-file .github/scripts/autoupdate-checks.yq $(find manifests -name autoupdate.yaml | sort)

      - id: set
        env:
          CHECKS_JSON: ${{ steps.configs.outputs.result }}
        run: printf '%s\n' "$CHECKS_JSON" | .github/scripts/generate-update-matrix.sh

  update:
    name: Update (${{ matrix.batch.name }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Install MSI inspection tools
        if: matrix.batch.needsMsi
        run: |
          sudo apt-get update
          sudo apt-get install --yes msitools

      - name: Resolve latest versions and URLs
        id: updates
        env:
          PACKAGES_JSON: ${{ toJson(matrix.batch.packages) }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resolve-package-updates.sh

      - name: Install Komac
        if: steps.updates.outputs.updates != '[]'
        uses: UnownPlain/install-komac@79a89eaaac36f74ca8b84ff8107849decde97f3c # 1.4

      - name: Submit updates
        if: steps.updates.outputs.updates != '[]'
        env:
          FORK_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.KOMAC_TOKEN }}
          KOMAC_TOKEN: ${{ secrets.KOMAC_TOKEN }}
          UPDATES_JSON: ${{ steps.updates.outputs.updates }}
        run: .github/scripts/submit-package-updates.sh

      # Packages whose check failed were skipped above; fail the job now that
      # the others have been submitted.
      - name: Fail on unresolved checks
        if: ${{ !cancelled() && steps.updates.outputs.failed == '1' }}
        run: |
          echo '::error::One or more update checks failed; see the "Resolve latest versions and URLs" step.'
          exit 1

  cleanup:
    name: Cleanup merged branches
    needs: update
    if: always() && !cancelled() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Install Komac
        uses: UnownPlain/install-komac@79a89eaaac36f74ca8b84ff8107849decde97f3c # 1.4

      - name: Cleanup merged branches
        env:
          KOMAC_TOKEN: ${{ secrets.KOMAC_TOKEN }}
        run: komac cleanup --only-merged --token "$KOMAC_TOKEN"
