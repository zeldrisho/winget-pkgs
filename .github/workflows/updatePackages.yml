name: Update WinGet Packages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Fork
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: update-winget-packages
  cancel-in-progress: false

jobs:
  generate-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            manifests/*/*/*/autoupdate.yaml
            manifests/*/*/*/*/autoupdate.yaml
            manifests/*/*/*/*/*/autoupdate.yaml

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install yq (mikefarah/yq via Homebrew — apt's "yq" is a different, incompatible tool)
        run: brew install yq

      - id: set
        run: |
          set -euo pipefail

          if [ -d manifests ]; then
            matrix=$(find manifests -name autoupdate.yaml -print | sort | while read -r f; do
              dir=$(dirname "$f")
              # strip "manifests/<letter>/" prefix, join remaining path segments with "."
              # handles multi-segment identifiers like NextDNS.NextDNS.CLI
              rel=${dir#manifests/*/}
              identifier=$(echo "$rel" | tr '/' '.')
              IDENTIFIER="$identifier" yq -o=json '. + {"identifier": strenv(IDENTIFIER)}' "$f"
            done | jq -s -c '.')
          else
            matrix=[]
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  update:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Install MSI inspection tools
        if: matrix.package.versionSource == 'msi'
        run: |
          sudo apt-get update
          sudo apt-get install --yes msitools

      - name: Resolve latest version and URLs
        id: ver
        env:
          CHECK_URL: ${{ matrix.package.checkUrl }}
          IDENTIFIER: ${{ matrix.package.identifier }}
          URL_TEMPLATE_VALUES: ${{ toJson(matrix.package.urlTemplateValues) }}
          URL_TEMPLATES: ${{ toJson(matrix.package.urlTemplates) }}
          VERSION_REGEX: ${{ matrix.package.versionRegex }}
          VERSION_SOURCE: ${{ matrix.package.versionSource }}
          VERSION_TEMPLATE: ${{ matrix.package.versionTemplate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome Safari'
          headers=$(mktemp)
          source=$(mktemp)
          # Some JSON endpoints reject HEAD requests; the GET below remains authoritative.
          effective_url=$(curl -sSLI -A "$user_agent" -o "$headers" -w '%{url_effective}' "$CHECK_URL")
          (cat "$headers"; printf '\n%s\n' "$effective_url") > "$source"
          # versionRegex MUST use \K (or be one big group with nothing outside it) —
          # grep -oP prints the whole match, not just the capture group, otherwise.
          if [ "$VERSION_SOURCE" = msi ]; then
            installer=$(mktemp)
            curl -fsSL -A "$user_agent" -o "$installer" "$CHECK_URL"
            match=$(msiinfo export "$installer" Property | grep -oP "$VERSION_REGEX" | head -1 || true)
          else
            match=$(grep -oP "$VERSION_REGEX" "$source" | head -1 || true)

            if [ -z "$match" ] || jq -e 'type == "object" and length > 0' <<< "$URL_TEMPLATE_VALUES" > /dev/null; then
              body=$(mktemp)
              curl -fsSL -A "$user_agent" -o "$body" "$CHECK_URL"
              cat "$body" >> "$source"
              match=$(grep -oP "$VERSION_REGEX" "$source" | head -1 || true)
            fi
          fi
          if [ -z "$match" ]; then
            echo "Could not resolve version for $IDENTIFIER" >&2
            exit 1
          fi

          if [ -n "$VERSION_TEMPLATE" ]; then
            version=${VERSION_TEMPLATE//\{MATCH\}/$match}
          else
            version=$match
          fi

          identifier_path=${IDENTIFIER//./\/}
          first_letter=$(printf '%s' "$IDENTIFIER" | cut -c1 | tr '[:upper:]' '[:lower:]')
          manifest_path="manifests/$first_letter/$identifier_path"
          existing_versions=$(gh api "repos/microsoft/winget-pkgs/contents/$manifest_path" --jq '.[].name')
          if grep -Fxq "$version" <<< "$existing_versions"; then
            echo "$IDENTIFIER $version already exists; skipping"
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # urlTemplates is a list, so multiple installers (x64/arm64/msi+exe) are supported
          urls_json=$(jq -c --arg version "$version" --arg match "$match" \
            'map(split("{VERSION}") | join($version) | split("{MATCH}") | join($match))' <<< "$URL_TEMPLATES")
          while read -r entry; do
            placeholder=$(base64 --decode <<< "$entry" | jq -r '.key')
            regex=$(base64 --decode <<< "$entry" | jq -r '.value')
            value=$(grep -oP "$regex" "$source" | head -1 || true)
            if [ -z "$value" ]; then
              echo "Could not resolve URL placeholder {$placeholder} for $IDENTIFIER" >&2
              exit 1
            fi
            urls_json=$(jq -c --arg placeholder "{$placeholder}" --arg value "$value" \
              'map(split($placeholder) | join($value))' <<< "$urls_json")
          done < <(jq -r '(. // {}) | to_entries[] | @base64' <<< "${URL_TEMPLATE_VALUES:-null}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "urls_json=$urls_json" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.ver.outputs.already_exists != 'true'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install Komac (Homebrew)
        if: steps.ver.outputs.already_exists != 'true'
        run: brew install komac

      - name: Submit update
        if: steps.ver.outputs.already_exists != 'true'
        env:
          IDENTIFIER: ${{ matrix.package.identifier }}
          KOMAC_TOKEN: ${{ secrets.KOMAC_TOKEN }}
          URLS_JSON: ${{ steps.ver.outputs.urls_json }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          readarray -t urls < <(jq -r '.[]' <<< "$URLS_JSON")

          komac update "$IDENTIFIER" \
            --version "$VERSION" \
            --urls "${urls[@]}" \
            --token "$KOMAC_TOKEN" \
            --submit

  cleanup:
    name: Cleanup merged branches
    needs: update
    if: always() && !cancelled() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install Komac (Homebrew)
        run: brew install komac

      - name: Cleanup merged branches
        env:
          KOMAC_TOKEN: ${{ secrets.KOMAC_TOKEN }}
        run: komac cleanup --only-merged --token "$KOMAC_TOKEN"
