name: Update WinGet Packages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Fork
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: update-winget-packages
  cancel-in-progress: false

jobs:
  generate-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/
            manifests/*/*/*/autoupdate.yaml
            manifests/*/*/*/*/autoupdate.yaml
            manifests/*/*/*/*/*/autoupdate.yaml

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.07.29.1

      - name: Install yq (mikefarah/yq via Homebrew — apt's "yq" is incompatible)
        run: brew install yq

      - id: set
        run: .github/scripts/generate-update-matrix.sh

  update:
    name: Update (${{ matrix.batch.name }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Install MSI inspection tools
        if: matrix.batch.needsMsi
        run: |
          sudo apt-get update
          sudo apt-get install --yes msitools

      - name: Resolve latest versions and URLs
        id: updates
        env:
          PACKAGES_JSON: ${{ toJson(matrix.batch.packages) }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resolve-package-updates.sh

      - name: Set up Homebrew
        if: steps.updates.outputs.updates != '[]'
        uses: Homebrew/actions/setup-homebrew@2026.07.29.1

      - name: Install Komac (Homebrew)
        if: steps.updates.outputs.updates != '[]'
        run: brew install komac

      - name: Submit updates
        if: steps.updates.outputs.updates != '[]'
        env:
          FORK_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.KOMAC_TOKEN }}
          KOMAC_TOKEN: ${{ secrets.KOMAC_TOKEN }}
          UPDATES_JSON: ${{ steps.updates.outputs.updates }}
        run: .github/scripts/submit-package-updates.sh

  cleanup:
    name: Cleanup merged branches
    needs: update
    if: always() && !cancelled() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.07.29.1

      - name: Install Komac (Homebrew)
        run: brew install komac

      - name: Cleanup merged branches
        env:
          KOMAC_TOKEN: ${{ secrets.KOMAC_TOKEN }}
        run: komac cleanup --only-merged --token "$KOMAC_TOKEN"
