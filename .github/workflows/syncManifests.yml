name: Sync Autoupdate Manifests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC; updatePackages runs at 03:00 after this

permissions:
  contents: write

concurrency:
  group: sync-manifests
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: .github

      - name: Sync upstream manifests for autoupdate packages
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch --depth=1 --filter=blob:none upstream "$DEFAULT_BRANCH"

          # Sync only the manifest folders of packages that have an
          # autoupdate.yaml in the fork. The autoupdate.yaml files themselves
          # are fork-only (absent upstream) and must never be restored.
          changed_paths=$(mktemp)
          mapfile -d '' pkg_dirs < <(
            git ls-tree -r -z --name-only HEAD -- manifests \
              | grep -z 'autoupdate.yaml$' \
              | sed -z 's#/autoupdate.yaml$##'
          )
          if [[ ${#pkg_dirs[@]} -eq 0 ]]; then
            echo "No autoupdate.yaml files found; nothing to sync"
            exit 0
          fi

          git diff --name-only -z HEAD "upstream/$DEFAULT_BRANCH" -- \
            "${pkg_dirs[@]}" ':(exclude,glob)manifests/**/autoupdate.yaml' > "$changed_paths"

          if [[ -s "$changed_paths" ]]; then
            git restore --source="upstream/$DEFAULT_BRANCH" --staged --worktree \
              --ignore-skip-worktree-bits --pathspec-from-file="$changed_paths" \
              --pathspec-file-nul
            git commit -m "chore(sync): update upstream manifests"
            git push origin "HEAD:$DEFAULT_BRANCH"
          else
            echo "Manifests are already synchronized"
          fi
