name: Sync Fork

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC; updatePackages runs after this completes

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream while preserving fork automation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch upstream "$DEFAULT_BRANCH"
          if ! git merge --no-edit "upstream/$DEFAULT_BRANCH"; then
            if git diff --quiet --diff-filter=U; then
              echo "::error::Upstream merge failed without producing conflicts"
              exit 1
            fi

            # Keep files intentionally deleted by the fork. Upstream changes to
            # those files otherwise produce recurring modify/delete conflicts.
            while IFS= read -r -d '' path; do
              if ! git cat-file -e "HEAD:$path" 2>/dev/null; then
                git rm -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            if ! git diff --quiet --diff-filter=U; then
              echo "::error::Upstream merge has conflicts requiring manual resolution"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit --no-edit
          fi
          git push origin "HEAD:$DEFAULT_BRANCH"
